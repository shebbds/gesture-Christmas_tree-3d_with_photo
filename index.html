<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寿桃献瑞 · 3D 粒子祝寿花篮</title>
    <meta name="description" content="由玫瑰、康乃馨、心形、寿桃与寿字粒子汇聚而成的祝寿花篮。">
    <meta name="theme-color" content="#6d0018">

    <!-- 分享到社交平台时的预览卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="寿桃献瑞 · 3D 粒子祝寿花篮">
    <meta property="og:description" content="2000 个祝寿装饰物、2000 粒金尘与 1000 片雪花组成的互动粒子艺术。">
    <meta property="og:url" content="https://shebbds.github.io/gesture-Christmas_tree-3d_with_photo/">
    <meta property="og:image" content="https://shebbds.github.io/gesture-Christmas_tree-3d_with_photo/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">万千星光正在汇聚</div>
    </div>

    <div class="festive-backdrop" aria-hidden="true">
        <div class="lantern lantern-left"><i></i><span>福</span></div>
        <div class="lantern lantern-right"><i></i><span>寿</span></div>
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>
        <div class="gold-halo"></div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hero-copy">
            <p class="eyebrow">福 如 东 海 长 流 水</p>
            <h1>寿桃献瑞</h1>
            <p class="subtitle">寿比南山不老松 · 福寿绵长</p>
        </div>

        <div class="controls-wrapper">
            <div class="btn-group">
                <label class="upload-btn">
                    选择照片文件夹
                    <input type="file" id="folder-input" webkitdirectory directory multiple>
                </label>

                <label class="upload-btn">
                    添加祝福照片
                    <input type="file" id="file-input" multiple accept="image/*">
                </label>
            </div>
            <div class="btn-group">
                <button class="upload-btn" id="camera-btn" type="button">📷 开启摄像头</button>
                <button class="upload-btn" id="music-btn" type="button" aria-pressed="true">♫ 喜洋洋：开</button>
                <button class="upload-btn" id="save-btn" type="button">保存贺卡</button>
                <button class="upload-btn" id="help-btn" type="button">玩法说明</button>
            </div>
            <p class="hint-text">
                拖拽旋转 · 滚轮缩放<br>
                H 隐藏界面 · T 聚成花篮 · S 散开 · D 调试
            </p>
        </div>
    </div>

    <!-- 首次进入的引导：不讲清楚要做什么手势，用户开了摄像头也只会发愣 -->
    <div id="onboarding" hidden>
        <div class="onboarding-card">
            <h2>用手势唤醒福寿花篮</h2>
            <ul class="gesture-list">
                <li>
                    <span class="gesture-emoji">✊</span>
                    <strong>握拳</strong>
                    <span>花朵聚合成福寿花篮</span>
                </li>
                <li>
                    <span class="gesture-emoji">🖐️</span>
                    <strong>张开手掌</strong>
                    <span>花瓣化作祝福星光，移动手掌转动视角</span>
                </li>
                <li>
                    <span class="gesture-emoji">🤏</span>
                    <strong>捏合手指</strong>
                    <span>随机抓一张照片并锁定停留，握拳退出</span>
                </li>
            </ul>
            <p class="onboarding-note">
                没有摄像头也能玩：拖拽旋转、滚轮缩放，<kbd>T</kbd> / <kbd>S</kbd> 切换形态。点击“开始”也会开启喜庆音乐。
            </p>
            <button class="upload-btn onboarding-start" id="onboarding-close" type="button">开启祝福</button>
        </div>
    </div>

    <div id="webcam-wrapper" style="display: none">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="debug-info">—</div>
        <div id="status-info">Initializing…</div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
